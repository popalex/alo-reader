# Base stack: dev = prod topology. Run from the repo root via `make up`.
#
# Configuration comes from the repo-root .env (template: .env.example). Two
# separate mechanisms, both needed:
#   - `${VAR}` interpolation below, which compose resolves from the file named by
#     --env-file. The Makefile passes --env-file .env, because compose otherwise
#     derives its project directory from this file and reads deploy/.env.
#   - `env_file:` on api/worker/migrate, which hands the whole file to the process.
#     Settings has ~40 fields and only a handful were ever listed under
#     `environment:`, so without this every other knob in .env.example was inert.
# `environment:` entries win over env_file, which is what keeps the compose-level
# defaults working on a machine with no .env at all.

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    environment:
      # Caddy's site address. Empty means :80, plain HTTP, which is what `make up`
      # and CI want. Set it to a hostname you control and Caddy issues and renews a
      # Let's Encrypt certificate on first request (see deploy/Caddyfile).
      ALO_SITE_ADDRESS: ${ALO_SITE_ADDRESS:-:80}
      # The Clerk frontend API origin the CSP must allow. clerk-js is loaded from
      # the host encoded in your publishable key, so a pk_live_ key needs your own
      # clerk.<domain> here or the CSP blocks login outright (see deploy/Caddyfile).
      ALO_CLERK_ORIGIN: ${ALO_CLERK_ORIGIN:-https://*.clerk.accounts.dev}
      # Who may reach /grafana through the public address. Loopback only by default.
      ALO_GRAFANA_ALLOW_IPS: ${ALO_GRAFANA_ALLOW_IPS:-127.0.0.1/32 ::1}
      # Who may post browser traces to /otlp. Also loopback only by default: it is an
      # unauthenticated write endpoint and nothing in front of it can rate limit.
      ALO_OTLP_ALLOW_IPS: ${ALO_OTLP_ALLOW_IPS:-127.0.0.1/32 ::1}
    ports:
      - "80:80"
      # Only listened on once ALO_SITE_ADDRESS names a host, but published either
      # way: the ACME challenge needs both ports reachable, and publishing 443
      # unused costs nothing.
      - "443:443"
    volumes:
      # Issued certificates and the ACME account key. This has to survive a
      # container recreate. Without it every `make up` re-issues, and Let's Encrypt
      # caps duplicate certificates at 5 per week.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # Wait until the API reports healthy before proxying, so a cold start never
      # serves 502s from Caddy while uvicorn is still booting.
      api:
        condition: service_healthy

  # One-shot: applies Alembic migrations to head, then exits. api/worker wait for
  # it to finish (service_completed_successfully), so schema is always current
  # before they boot — and with N replicas this runs exactly once, not per-replica.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        # Stamped into /api/v1/healthz, the OpenAPI document and every OTel span.
        # Unset, a self-hosted build reports 0.0.0+dev forever; set it to the tag
        # you are deploying. CI passes 0.0.0+<sha>.
        APP_VERSION: ${APP_VERSION:-0.0.0+dev}
    command: ["migrate"]
    restart: "no"
    env_file:
      # The whole .env, so every Settings field is reachable without listing it
      # here. Optional: a fresh clone and CI have no .env and fall back to the
      # defaults below. Settings ignores unknown keys, so the Postgres/Grafana
      # variables riding along are inert in these processes.
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alo:alo@postgres:5432/alo}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        # Stamped into /api/v1/healthz, the OpenAPI document and every OTel span.
        # Unset, a self-hosted build reports 0.0.0+dev forever; set it to the tag
        # you are deploying. CI passes 0.0.0+<sha>.
        APP_VERSION: ${APP_VERSION:-0.0.0+dev}
    command: ["api"]
    restart: unless-stopped
    env_file:
      # The whole .env, so every Settings field is reachable without listing it
      # here. Optional: a fresh clone and CI have no .env and fall back to the
      # defaults below. Settings ignores unknown keys, so the Postgres/Grafana
      # variables riding along are inert in these processes.
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alo:alo@postgres:5432/alo}
      # No default on purpose: the API refuses to boot without an explicit
      # AUTH_MODE (set it in .env; see .env.example). Dev overlay sets "none".
      AUTH_MODE: ${AUTH_MODE:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-10}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-30}
    # /healthz needs neither DB nor auth; probe with the in-image Python (slim has
    # no curl). start_period covers first boot / migration wait.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        # Stamped into /api/v1/healthz, the OpenAPI document and every OTel span.
        # Unset, a self-hosted build reports 0.0.0+dev forever; set it to the tag
        # you are deploying. CI passes 0.0.0+<sha>.
        APP_VERSION: ${APP_VERSION:-0.0.0+dev}
    command: ["worker"]
    # unless-stopped (not on-failure): the worker also exits non-zero on an
    # unexpected crash (see worker/main.py), so this recovers a crashed poller
    # while still respecting an operator's explicit `docker compose stop`.
    restart: unless-stopped
    env_file:
      # The whole .env, so every Settings field is reachable without listing it
      # here. Optional: a fresh clone and CI have no .env and fall back to the
      # defaults below. Settings ignores unknown keys, so the Postgres/Grafana
      # variables riding along are inert in these processes.
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alo:alo@postgres:5432/alo}
      # Hostnames exempt from the SSRF private-range block (trusted internal feeds).
      FETCH_ALLOW_HOSTS: ${FETCH_ALLOW_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Nightly pg_dump | zstd to the `backups` volume, 14 days kept, optionally
  # copied off-box with rclone. DESIGN.md §1.5: running Postgres yourself means
  # backups are your problem, so this is part of the stack rather than a runbook
  # step. scripts/restore.sh is the other half.
  backup:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backup
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # libpq's own variables: the app's DATABASE_URL is SQLAlchemy-flavoured
      # (postgresql+asyncpg://) and libpq will not parse it.
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-alo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-alo}
      PGDATABASE: ${POSTGRES_DB:-alo}
      BACKUP_SCHEDULE_UTC: ${BACKUP_SCHEDULE_UTC:-03:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      BACKUP_ZSTD_LEVEL: ${BACKUP_ZSTD_LEVEL:-10}
      # Empty means local-only. Set it to an rclone remote (e.g. s3:bucket/alo)
      # and each new dump is copied there and pruned on the same retention.
      # rclone is configured from RCLONE_CONFIG_* variables in .env, which env_file
      # above already passes through, so there is no config file to mount.
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Postgres 18 + RUM extension (search's index-ordered FTS; see Dockerfile).
    # restart, like the services that depend on it: depends_on is honoured at `up`
    # time only, so without this a host reboot brings back api, worker, caddy and
    # backup against a database that never starts, and nothing recovers until
    # somebody notices and SSHes in.
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile.postgres
    image: alo-reader-postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alo}
      POSTGRES_DB: ${POSTGRES_DB:-alo}
    volumes:
      # postgres:18+ images require the mount at /var/lib/postgresql (data lives
      # in a version-specific subdir); mounting .../data is refused at boot.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alo} -d ${POSTGRES_DB:-alo}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
