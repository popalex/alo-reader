# OpenTelemetry overlay: adds the collector (Grafana Alloy) + the all-in-one Grafana
# LGTM stack (Loki/Grafana/Tempo/Prometheus), and turns telemetry on for api + worker.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.otel.yml up --build -d
#   (or `make otel-up`)
#
# The browser SPA learns OTEL is on from /api/v1/config and posts its spans to the
# same-origin /otlp path, which the base Caddyfile proxies to the collector.

services:
  api:
    build:
      args:
        # Pull the OpenTelemetry SDK + instrumentation into the image.
        PIP_REQUIREMENTS: "-r requirements.txt -r requirements-otel.txt"
    environment:
      # Default to none for the local telemetry demo (override with an explicit
      # AUTH_MODE), same as the dev overlay — otherwise api SystemExits and caddy,
      # which waits for api to be healthy, never starts.
      AUTH_MODE: ${AUTH_MODE:-none}
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: alo-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=dev}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_METRICS_EXEMPLAR_FILTER: ${OTEL_METRICS_EXEMPLAR_FILTER:-trace_based}
    depends_on:
      otel-collector:
        condition: service_started

  worker:
    build:
      args:
        PIP_REQUIREMENTS: "-r requirements.txt -r requirements-otel.txt"
    environment:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: alo-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=dev}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_METRICS_EXEMPLAR_FILTER: ${OTEL_METRICS_EXEMPLAR_FILTER:-trace_based}
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: grafana/alloy:v1.17.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      otel-lgtm:
        condition: service_started
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only host mounts for the unix exporter's filesystem collector, which is
      # where the disk alert gets its numbers. rslave propagates mounts made after the
      # container started, so a volume added later is still measured. Nothing is
      # written, and only the filesystem collector runs (see config.alloy).
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  otel-lgtm:
    image: grafana/otel-lgtm:0.28.0
    restart: unless-stopped
    environment:
      # otel-lgtm ships Grafana with anonymous Admin access for convenience. Since Grafana
      # is reachable through Caddy's public /grafana route, it must guard itself: disable
      # anonymous access and require a login. Override the credentials for real use.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Served under /grafana behind Caddy, so Grafana must know its sub-path or assets and
      # redirects break. ROOT_URL defaults to the dev origin (Caddy on :3000); point it at
      # your external URL in prod (e.g. https://example.com/grafana/).
      # The published loopback port, not :3000 — that is the dev overlay's Caddy, so
      # `make otel-up` (base + otel, no dev) served links to a port nothing listens
      # on. The /grafana sub-path has to stay: it is how Caddy's route works, and it
      # is why bare http://localhost:3001 404s. Point this at your external URL in
      # production; every link in an alert notification is built from it.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3001}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Pushover credentials for the alert floor (see alerting/notifications.yml).
      # Unset means the contact point still provisions and alerts still show in
      # Grafana; only delivery fails, and Grafana logs Pushover's own rejection.
      ALO_PUSHOVER_USER_KEY: ${ALO_PUSHOVER_USER_KEY:-unset}
      ALO_PUSHOVER_API_TOKEN: ${ALO_PUSHOVER_API_TOKEN:-unset}
    ports:
      # Loopback only — reachable from the host (localhost:3001) or an SSH tunnel, never a
      # public interface. Public access goes through Caddy's /grafana route instead.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - otel-lgtm-data:/data
      # Dropping a *.json into observability/dashboards/ auto-provisions it into an
      # "alo-reader" Grafana folder (whole dir mounted read-only).
      - ./observability/dashboards:/otel-lgtm/grafana/dashboards/alo-reader:ro
      - ./observability/provisioning.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/alo-reader.yml:ro
      # The alert floor (worker lag, 5xx rate, disk). File-provisioned rules are
      # read-only in the Grafana UI on purpose: they survive every container recreate
      # exactly as written. Thresholds live in the file; see docs/ALERTS.md.
      - ./observability/alerting/alo-floor.yml:/otel-lgtm/grafana/conf/provisioning/alerting/alo-floor.yml:ro
      # The address and the routing that reaches it. Without the policy half, alerts
      # fire into the image's default "empty" receiver and nobody hears anything.
      - ./observability/alerting/notifications.yml:/otel-lgtm/grafana/conf/provisioning/alerting/notifications.yml:ro

volumes:
  otel-lgtm-data:
