# OpenTelemetry overlay: adds the collector (Grafana Alloy) + the all-in-one Grafana
# LGTM stack (Loki/Grafana/Tempo/Prometheus), and turns telemetry on for api + worker.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.otel.yml up --build -d
#   (or `make otel-up`)
#
# The browser SPA learns OTEL is on from /api/v1/config and posts its spans to the
# same-origin /otlp path, which the base Caddyfile proxies to the collector.

# Log rotation for the services this overlay adds. The base file's x-logging anchor
# cannot reach across files, and these two are the noisiest containers in the stack —
# sitting on the same disk the alert floor watches.
services:
  api:
    build:
      args:
        # Pull the OpenTelemetry SDK + instrumentation into the image.
        PIP_REQUIREMENTS: "-r requirements.txt -r requirements-otel.txt"
    environment:
      # Default to none for the local telemetry demo (override with an explicit
      # AUTH_MODE), same as the dev overlay — otherwise api SystemExits and caddy,
      # which waits for api to be healthy, never starts.
      AUTH_MODE: ${AUTH_MODE:-none}
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: alo-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=dev}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_METRICS_EXEMPLAR_FILTER: ${OTEL_METRICS_EXEMPLAR_FILTER:-trace_based}
    depends_on:
      otel-collector:
        condition: service_started

  worker:
    build:
      args:
        PIP_REQUIREMENTS: "-r requirements.txt -r requirements-otel.txt"
    environment:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: alo-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=dev}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      OTEL_METRICS_EXEMPLAR_FILTER: ${OTEL_METRICS_EXEMPLAR_FILTER:-trace_based}
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/alloy:v1.17.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      otel-lgtm:
        condition: service_started
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only host mounts for the unix exporter's filesystem collector, which is
      # where the disk alert gets its numbers. rslave propagates mounts made after the
      # container started, so a volume added later is still measured. Nothing is
      # written, and only the filesystem collector runs (see config.alloy).
      - /:/host/root:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  otel-lgtm:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: grafana/otel-lgtm:0.28.0
    restart: unless-stopped
    environment:
      # otel-lgtm ships Grafana with anonymous Admin access for convenience. Since Grafana
      # is reachable through Caddy's public /grafana route, it must guard itself: disable
      # anonymous access and require a login. Override the credentials for real use.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Served under /grafana behind Caddy, so Grafana must know its sub-path or assets and
      # redirects break. ROOT_URL defaults to the dev origin (Caddy on :3000); point it at
      # your external URL in prod (e.g. https://example.com/grafana/).
      # The published loopback port, not :3000 — that is the dev overlay's Caddy, so
      # `make otel-up` (base + otel, no dev) served links to a port nothing listens
      # on. The /grafana sub-path has to stay: it is how Caddy's route works, and it
      # is why bare http://localhost:3001 404s. Point this at your external URL in
      # production; every link in an alert notification is built from it.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3001}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Storage budget for the telemetry stack. None of the three takes a disk quota:
      # Loki and Tempo throttle ingestion and expire on a schedule, so their bound is
      # rate x retention (hundreds of gigabytes at these defaults, if something floods
      # them for the full window), and Prometheus deletes its oldest blocks once the
      # size is passed. The numbers below make the *expected* footprint trivial — tens
      # of megabytes for one instance — and a flood slow. They do not cap the disk.
      # deploy/observability/README.md has the arithmetic and how to resize.
      #
      # This is the second line of defence, not the first. /otlp and /grafana are
      # loopback-only (deploy/Caddyfile): reach them with `ssh -L` or `tailscale
      # serve`, not by widening the allow-list. An internal runaway — a worker stuck in
      # a logging loop, a feed producing a span per item — is slowed by these limits,
      # not stopped: at 2 MB/s Loki still reaches ~500 GB inside its retention window.
      # The disk alert (docs/ALERTS.md) is what actually catches that.
      # Prometheus is the only one with a size-based policy at all, and its own --help
      # scopes it to blocks: it deletes the oldest ones when a compaction finds the
      # total passed, and it cannot delete the head. Leave headroom above the number.
      # Both flags are deprecated in Prometheus 3.11 in favour of config-file fields
      # and still honoured — the image gives us an args hook, not a config file.
      PROMETHEUS_EXTRA_ARGS: >-
        --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
        --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-1GB}
      # Both burst knobs are pinned at their own defaults (Loki 6 MB, Tempo 20 MB) so
      # this changes nothing until an operator lowers one. They are here because they
      # are invisible otherwise: a burst is admitted on top of the rate, and Tempo's
      # 20 MB against a 500 KB/s rate is 40 seconds of allowance in one go.
      #
      # Loki needs all three: the compactor deletes nothing unless retention is
      # enabled, refuses to start with retention enabled and no delete-request store,
      # and honours -store.retention rather than the legacy table-manager period
      # (which belongs to the old index scheme and is documented as destructive).
      LOKI_EXTRA_ARGS: >-
        -distributor.ingestion-rate-limit-mb=${LOKI_INGEST_RATE_MB:-2}
        -distributor.ingestion-burst-size-mb=${LOKI_INGEST_BURST_MB:-6}
        -compactor.retention-enabled
        -compactor.delete-request-store=filesystem
        -store.retention=${LOKI_RETENTION:-72h}
      TEMPO_EXTRA_ARGS: >-
        -distributor.ingestion-rate-limit-bytes=${TEMPO_INGEST_RATE_BYTES:-500000}
        -distributor.ingestion-burst-size-bytes=${TEMPO_INGEST_BURST_BYTES:-20000000}
        -ingester.max-bytes-per-trace=${TEMPO_MAX_TRACE_BYTES:-5000000}
        -compactor.compaction.compaction.block-retention=${TEMPO_RETENTION:-48h}
        -backend-scheduler.provider.work.compaction.compaction.block-retention=${TEMPO_RETENTION:-48h}
        -backend-worker.compaction.compaction.block-retention=${TEMPO_RETENTION:-48h}
      # Pushover credentials for the alert floor (see alerting/notifications.yml).
      # Unset means the contact point still provisions and alerts still show in
      # Grafana; only delivery fails, and Grafana logs Pushover's own rejection.
      ALO_PUSHOVER_USER_KEY: ${ALO_PUSHOVER_USER_KEY:-unset}
      ALO_PUSHOVER_API_TOKEN: ${ALO_PUSHOVER_API_TOKEN:-unset}
    ports:
      # Loopback only — reachable from the host (localhost:3001) or an SSH tunnel, never a
      # public interface. Public access goes through Caddy's /grafana route instead.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - otel-lgtm-data:/data
      # Dropping a *.json into observability/dashboards/ auto-provisions it into an
      # "alo-reader" Grafana folder (whole dir mounted read-only).
      - ./observability/dashboards:/otel-lgtm/grafana/dashboards/alo-reader:ro
      - ./observability/provisioning.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/alo-reader.yml:ro
      # The alert floor (worker lag, 5xx rate, disk). File-provisioned rules are
      # read-only in the Grafana UI on purpose: they survive every container recreate
      # exactly as written. Thresholds live in the file; see docs/ALERTS.md.
      - ./observability/alerting/alo-floor.yml:/otel-lgtm/grafana/conf/provisioning/alerting/alo-floor.yml:ro
      # The address and the routing that reaches it. Without the policy half, alerts
      # fire into the image's default "empty" receiver and nobody hears anything.
      - ./observability/alerting/notifications.yml:/otel-lgtm/grafana/conf/provisioning/alerting/notifications.yml:ro

volumes:
  otel-lgtm-data:
