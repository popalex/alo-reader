# Where a firing alert goes: a push notification on the owner's phone.
#
# Two halves, and both are needed. The contact point is the Pushover account, taken
# from .env (Grafana expands environment variables in provisioning files). The policy
# is the routing, and it is not optional here: the otel-lgtm image ships a default
# route pointing at a receiver named "empty", so alerts evaluate, fire, and go
# nowhere. Provisioning a contact point alone changes a destination nothing routes to.
#
# Pushover rather than email because these three alerts fire when the box is sick, and
# a push arrives now rather than whenever you next open your mail. Grafana speaks
# Pushover natively, so there is no webhook template to escape by hand.
#
# Cost of provisioning the policy: Grafana marks it read-only in the UI. To route
# somewhere else, edit this file, or drop the mount from docker-compose.otel.yml and
# take over in the UI. See docs/ALERTS.md.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: alo-pushover
    receivers:
      - uid: alo-owner-pushover
        type: pushover
        settings:
          # From pushover.net: the user key is on the dashboard, the API token comes
          # from an application you register there (call it alo-reader).
          userKey: ${ALO_PUSHOVER_USER_KEY}
          apiToken: ${ALO_PUSHOVER_API_TOKEN}
          # Numbers, not strings. Quoted, Grafana passes them through to Pushover as
          # something it rejects with a bare 400 Bad Request, which looks exactly like
          # a credential problem and is not one. Cost me an afternoon.
          #
          # 1 = high: red, and it ignores your quiet hours, which is the point of
          # sending it to a phone. Resolved messages come in at -1 so the all-clear
          # never wakes anyone.
          #
          # For 2 (emergency, retries until you acknowledge) set retry and expire in
          # seconds as well, e.g. retry: "60", expire: "3600". Overkill for a feed
          # reader; the right call for something that pages a rota.
          priority: 1
          okPriority: -1
          # The templates below. Without these Grafana sends its generic layout: a
          # "[FIRING:1] ..." title, every label and annotation as a list, and four
          # links built from GRAFANA_ROOT_URL, which on a phone is mostly noise.
          title: '{{ template "alo.title" . }}'
          message: '{{ template "alo.message" . }}'

policies:
  - orgId: 1
    receiver: alo-pushover
    group_by: [grafana_folder, alertname]
    # Batch the first burst, then stay quiet: one push 30s after a rule fires, at most
    # one more every 5 minutes while new alerts join the group, and a reminder twice a
    # day for as long as it keeps firing.
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h

# What a push says. Pushover renders a small set of HTML in the message (Grafana sends
# it with html=1) but not in the title, which is plain text.
#
# Firing: the summary in bold, the rule's current value against its limit (the
# "current" annotation in alo-floor.yml, filled in when the rule is evaluated), what
# it breaks, the runbook, and the rule in Grafana. Each URL is its own link text, so
# it can be copied as well as tapped. The rule link is there because the "Show alert
# rule" button under the message is Grafana's: its label is fixed and it opens the
# whole alert list. Both Grafana links are built from GRAFANA_ROOT_URL, so on the
# default they point at localhost. No timestamp: Pushover shows when the push arrived,
# in the phone's own time zone.
#
# Resolved: how long it lasted. The title already says which alert it was.
#
# Annotations a rule leaves out are skipped, so scripts/test-alerts.sh's temporary
# rule, which has only a summary, still renders cleanly.
templates:
  - orgID: 1
    name: alo-pushover
    template: |
      {{ define "alo.title" -}}
      {{ if eq .Status "firing" }}{{ .CommonLabels.alertname }}{{ else }}Resolved: {{ .CommonLabels.alertname }}{{ end }}
      {{- end }}

      {{ define "alo.message" -}}
      {{ range .Alerts.Firing -}}
      <b>{{ .Annotations.summary }}</b>
      {{ if .Annotations.current }}{{ .Annotations.current }}
      {{ end }}{{ if .Annotations.description }}
      {{ .Annotations.description }}
      {{ end }}{{ if .Annotations.runbook_url }}
      What to do: <a href="{{ .Annotations.runbook_url }}">{{ .Annotations.runbook_url }}</a>
      {{ end }}{{ if .GeneratorURL }}
      Alert rule: <a href="{{ .GeneratorURL }}">{{ .GeneratorURL }}</a>
      {{ end }}
      {{ end -}}
      {{ range .Alerts.Resolved -}}
      <b>Back to normal</b>
      Lasted {{ printf "%.0f" (.EndsAt.Sub .StartsAt).Minutes }} min.
      {{ end -}}
      {{- end }}
