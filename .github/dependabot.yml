# Dependency update PRs. The point is a red PR instead of a red main: an upstream
# release arrives as a reviewable change, not as whatever CI happens to resolve.
# svix 2.0 landed exactly that way and broke the Clerk webhook on main.
#
# Grouping keeps the volume sane. Patch and minor bumps ride together per ecosystem
# (one PR to skim, one CI run); majors stay on their own, because those are the ones
# that change behaviour and deserve to be read.
version: 2
updates:
  # No pip entry, deliberately. /api is locked as three pip-compile files that must
  # agree with each other (requirements.txt, and -dev / -otel layered on it).
  # Dependabot edits requirements files in place rather than recompiling the set, so
  # a shared transitive gets resolved per file and the result is unsatisfiable —
  # PR #38 bumped 19 packages and died on
  # `Cannot install -r requirements-dev.txt (line 90) and pydantic-core==2.48.0 ...
  # ResolutionImpossible`, failing every job. That is not a stale-PR problem, it is
  # not mergeable in principle, and a weekly cadence would reproduce it weekly.
  #
  # Python dependencies are refreshed with `make lock-upgrade`, which recompiles all
  # three in one pass so they cannot disagree. CVEs are still covered: Dependabot
  # security alerts are enabled repo-wide, and `pip-audit --skip-editable` gates every
  # CI run. This suppresses routine version-update PRs, not vulnerability reporting.

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # React and Clerk in one PR. @clerk/react pins React to the minors it has
      # been tested with (~19.3.0-0), and pnpm only warns on an unmet peer, so a
      # React bump on its own would pass CI while leaving Clerk outside its range.
      # Listed first: a dependency joins the first group it matches.
      react-and-clerk:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "@clerk/*"]
      # Every OpenTelemetry package in one PR, majors included. The experimental
      # 0.x packages pin the stable 2.x/3.x ones exactly, so moving one side alone
      # leaves two OTel trees in the lock and browser spans stop arriving, with no
      # error and no failing test. #136 did exactly that: instrumentation 0.300 counts
      # as a minor bump, core 3.0 as a major, and the minor group took only the first.
      # Merge this group only after checking spans reach Tempo end to end.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      web-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(web)

  # The Jul 13 nightly died on a pnpm/action-setup outage, not on our code. Pinned
  # actions that get bumped deliberately beat floating ones that break overnight.
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the local composite actions (setup-web pins
    # actions/setup-node) live in their own directories and are listed separately.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The docker ecosystem reads Dockerfiles only. Images named in the compose files
  # (cloudflared, alloy, otel-lgtm, nginx) need their own entry: cloudflared sat on a
  # release that trusted the weak emSign intermediates until a Cloudflare email
  # flagged it, and Dependabot never opened a PR for it.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    commit-message:
      prefix: build(deploy)

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    commit-message:
      prefix: build(deploy)
