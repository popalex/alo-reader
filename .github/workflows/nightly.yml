name: Nightly

# What does not belong on a PR: the 5M-entry search benchmark (minutes of seeding),
# the dependency-update report (a check against time, not against a diff), and e2e
# a second time against main, where it catches environment drift a PR cannot.
#
# e2e and Lighthouse also run per-PR in ci.yml — e2e moved there after a PR with
# every other check green shipped a regression only it caught.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {} # on-demand ("Run workflow" button)

# A manual run supersedes an in-flight one; never cancel the scheduled run.
concurrency:
  group: nightly-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  e2e:
    # Same gate as the per-PR one in ci.yml, run against main on a schedule: a
    # green PR proves the diff, this proves the environment has not drifted under it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm -C web install
      - name: Install Playwright Chromium
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: make e2e
        run: make e2e
      - name: Upload Playwright traces
        # trace: "on-first-retry" — without this the only record of a nightly
        # flake dies with the runner.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  python-deps:
    # What Python dependencies could be upgraded. Reports only: it never edits a
    # lockfile, never opens a PR, and never fails the nightly — taking an update is
    # the operator's call, made with `make lock-upgrade`.
    #
    # This replaces the Dependabot pip entry, which could not maintain this lockfile
    # set: it edits requirements files in place rather than recompiling, so a shared
    # transitive is resolved per file and the result is unsatisfiable (PR #38 died on
    # ResolutionImpossible and failed every job). scripts/deps-report.sh resolves all
    # three in one pass, the same way `make lock` does.
    #
    # The findings land in the run's job summary, so they are visible on the Actions
    # page without opening logs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Report available Python dependency updates
        run: ./scripts/deps-report.sh

  bench-search:
    # Search p95 budget (< 100 ms) at full 5M-entry scale (DESIGN §4.1.6). Too slow
    # to seed per-PR; the 100k profile gates PRs in ci.yml.
    #
    # Seeding dominates the wall clock (the measured run is ~20s), so the timeout
    # is sized for the seed, not the benchmark.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql+asyncpg://alo:alo@localhost:5432/alo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r api/requirements-dev.txt && python -m pip install -e ./api --no-deps
      - name: Build + start Postgres (rum)
        run: |
          docker build -f deploy/Dockerfile.postgres -t alo-reader-postgres:local deploy
          docker run -d --name pg -e POSTGRES_USER=alo -e POSTGRES_PASSWORD=alo \
            -e POSTGRES_DB=alo -p 5432:5432 alo-reader-postgres:local
          for i in $(seq 1 30); do docker exec pg pg_isready -U alo -d alo && break; sleep 2; done
      - name: Migrate
        run: cd api && alembic upgrade head
      # BENCH_KEEP=1 skips the teardown. The script's exit path deletes the bench
      # user and feed, which cascades all 5M entries — several minutes of work on a
      # database this job throws away seconds later. The container is the cleanup.
      - name: Benchmark (5M profile)
        run: BENCH_PROFILE=nightly BENCH_KEEP=1 python scripts/bench_search.py
