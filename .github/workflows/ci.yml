name: CI

# Feature branches run once, via pull_request (which tests the simulated merge
# with main); push only fires for main itself (post-merge). This avoids the
# double run you'd get from push + pull_request both matching a PR branch.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r api/requirements-dev.txt && python -m pip install -e ./api --no-deps
      - run: ruff check api
      - run: ruff format --check api

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # [otel] too so mypy resolves the OpenTelemetry imports in app/telemetry.py
      # (the module imports them lazily at runtime, but typecheck follows them).
      - run: python -m pip install -r api/requirements-dev.txt -r api/requirements-otel.txt && python -m pip install -e ./api --no-deps
      # From api/, not the repo root: mypy reads its config from the working
      # directory, and [tool.mypy] (strict, pydantic plugin) lives in
      # api/pyproject.toml. `mypy api` from the root silently ran on defaults.
      - run: mypy .
        working-directory: api
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm -C web install
      - run: pnpm -C web tsc
      - run: pnpm -C web lint

  test-api:
    # Tests provision their own throwaway Postgres via Testcontainers (Docker is
    # available on the runner) — no service container needed. The whole suite
    # must be green under both AUTH_MODE values (WP-02 acceptance).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        auth_mode: [clerk, none]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r api/requirements-dev.txt && python -m pip install -e ./api --no-deps
      # Migration 0003 needs the rum extension, so the Testcontainers Postgres
      # is our postgres:18+rum image (conftest defaults to alo-reader-postgres:local).
      - name: Build Postgres image (rum)
        run: docker build -f deploy/Dockerfile.postgres -t alo-reader-postgres:local deploy
      - run: pytest api
        env:
          AUTH_MODE: ${{ matrix.auth_mode }}

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm -C web install
      - run: pnpm -C web test

  bundle-size:
    # The SPA's initial JS+CSS must stay within the gz budget (DESIGN.md §1.2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm -C web install
      - run: pnpm -C web build
      - run: pnpm -C web size

  client-drift:
    # The typed client is generated from the API's OpenAPI schema; regenerate it
    # and fail if the committed output is stale (SPA <-> API contract drift).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r api/requirements-dev.txt && python -m pip install -e ./api --no-deps
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm -C web install
      - name: Regenerate typed client
        run: |
          cd api && AUTH_MODE=none python -c "import json,sys; from app.main import app; json.dump(app.openapi(), sys.stdout, sort_keys=True)" > ../web/openapi.json
          cd ../web && pnpm exec openapi-typescript openapi.json -o src/api/schema.d.ts
      - name: Fail on drift
        run: git diff --exit-code -- web/src/api/schema.d.ts

  bench-search:
    # Search p95 budget (< 100 ms) on the per-PR 100k-entry profile (DESIGN §4.1.6).
    # The 5M nightly profile runs in nightly.yml. Postgres must be our postgres:18
    # + rum image (built here, since GitHub service containers can't build), so it's
    # run as a plain container rather than a `services:` entry.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://alo:alo@localhost:5432/alo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r api/requirements-dev.txt && python -m pip install -e ./api --no-deps
      - name: Build + start Postgres (rum)
        run: |
          docker build -f deploy/Dockerfile.postgres -t alo-reader-postgres:local deploy
          docker run -d --name pg -e POSTGRES_USER=alo -e POSTGRES_PASSWORD=alo \
            -e POSTGRES_DB=alo -p 5432:5432 alo-reader-postgres:local
          for i in $(seq 1 30); do docker exec pg pg_isready -U alo -d alo && break; sleep 2; done
      - name: Migrate
        run: cd api && alembic upgrade head
      # BENCH_KEEP=1: same reasoning as the nightly — the cascade delete runs against
      # a database that is discarded with the job. Cheaper at 100k, still pointless.
      - name: Benchmark (100k profile)
        run: BENCH_PROFILE=pr BENCH_KEEP=1 python scripts/bench_search.py

  security-audit:
    # Supply-chain gate (WP-15): pip-audit for Python deps, pnpm audit for the
    # shipped (prod) web deps. Dev-only build tooling is excluded from the web gate
    # (it never reaches users); advisories with no available fix are ignored via
    # web/pnpm-workspace.yaml auditConfig so the gate stays actionable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -r api/requirements-dev.txt pip-audit && python -m pip install -e ./api --no-deps
      - name: pip-audit (Python deps)
        run: pip-audit --skip-editable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm -C web install --frozen-lockfile
      - name: pnpm audit (shipped web deps)
        run: pnpm -C web audit --prod --audit-level high

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Stamp the commit into the image so a running container can say which build
      # it is (/api/v1/healthz) without anyone shelling in.
      - run: docker build -f deploy/Dockerfile.api --build-arg APP_VERSION="0.0.0+${GITHUB_SHA::7}" -t alo-reader-api .
      - run: docker build -f deploy/Dockerfile.caddy -t alo-reader-caddy .
      - run: docker build -f deploy/Dockerfile.postgres -t alo-reader-postgres deploy

  e2e:
    # The only check that exercises the real app: compose stack (AUTH_MODE=none) +
    # seeded data + Playwright against the Caddy-served SPA. It lived in the nightly
    # until a PR whose every other check was green shipped a regression it would have
    # caught — a warm-up burst that rate-limited the API — so it gates PRs now and
    # still runs nightly against main for environment drift.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm -C web install
      - name: Install Playwright Chromium
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: make e2e
        run: make e2e
      - name: Upload Playwright traces
        # trace: "on-first-retry" — without this the only record of a flake dies
        # with the runner.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  lighthouse:
    # Performance budget (>= 90) on the built SPA. Cheap, and a budget regression is
    # easiest to fix in the PR that caused it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm -C web install
      - name: Install Chromium for Lighthouse
        # Populates ~/.cache/ms-playwright so lighthouse.sh finds a Chrome.
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: make lighthouse
        run: make lighthouse
