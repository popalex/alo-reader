<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>alo reader</title>
    <!-- The app is behind sign-in and marked noindex (X-Robots-Tag, deploy/Caddyfile),
         but its tab, bookmarks and shared links still show this. -->
    <meta
      name="description"
      content="A calm RSS reader: every article from every feed you follow, in the order it was published."
    />
    <meta name="theme-color" content="#0e7c6d" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- iOS standalone (WP-14): installable, full-bleed, no tap-delay artifacts. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="alo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- The first thing the app fetches, and everything else waits on it (auth mode
         decides whether Clerk loads). Fetched in parallel with the JS instead of
         after it, which takes one round trip off the path to the first list paint.
         Must stay a plain same-origin GET to match App.tsx's getConfig() request. -->
    <link rel="preload" href="/api/v1/config" as="fetch" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
